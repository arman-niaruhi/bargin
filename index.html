<body>
  <section class="hero">

    <section class="story" id="story" tabindex="0" role="region" aria-roledescription="carousel" aria-label="برگین">
      <div class="story-bars" aria-hidden="true"><span class="is-active"></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

          <source media="(min-width: 768px)" srcset="images/backgrounds/story-1-wide.jpg">

        </picture>
      </div>
      <div class="story-slide" role="group" aria-roledescription="اسلاید" aria-label="۲ از ۷">
        <picture>
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-2-wide.webp" type="image/webp">
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-2-wide.jpg">
          <source srcset="images/backgrounds/story-2.webp" type="image/webp">
          <img src="images/backgrounds/story-2.jpg" width="1080" height="1440" alt="نگران نباش! ما برات هر چیزی که بخوای رو تولید می‌کنیم 🌿 — خانمی آروم با یه فنجون چای کنار باغچه" loading="lazy" decoding="async">
        </picture>
      </div>
      <div class="story-slide" role="group" aria-roledescription="اسلاید" aria-label="۳ از ۷">
        <picture>
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-3-wide.webp" type="image/webp">
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-3-wide.jpg">
          <source srcset="images/backgrounds/story-3.webp" type="image/webp">
          <img src="images/backgrounds/story-3.jpg" width="1080" height="1440" alt="ما برات از خطه‌ی مازندران می‌ریم و سبزی‌ها و مواد اولیه‌ی محلی رو فراهم می‌کنیم — خانمی با سبد، سبزی می‌چینه" loading="lazy" decoding="async">
        </picture>
      </div>
      <div class="story-slide" role="group" aria-roledescription="اسلاید" aria-label="۴ از ۷">
        <picture>
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-4-wide.webp" type="image/webp">
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-4-wide.jpg">
          <source srcset="images/backgrounds/story-4.webp" type="image/webp">
          <img src="images/backgrounds/story-4.jpg" width="1080" height="1440" alt="مرحله ۱: شستشوی دقیق و سنتی — ما همه‌چیز رو با وسواس و طبیعی شستشو میدیم 🌿" loading="lazy" decoding="async">
        </picture>
      </div>
      <div class="story-slide" role="group" aria-roledescription="اسلاید" aria-label="۵ از ۷">
        <picture>
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-5-wide.webp" type="image/webp">
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-5-wide.jpg">
          <source srcset="images/backgrounds/story-5.webp" type="image/webp">
          <img src="images/backgrounds/story-5.jpg" width="1080" height="1440" alt="مرحله ۲: فرآوری خانگی بر اساس سفارش شما — همه چیز تازه و دقیقاً همونطور که خواستین آماده میشه" loading="lazy" decoding="async">
        </picture>
      </div>
      <div class="story-slide" role="group" aria-roledescription="اسلاید" aria-label="۶ از ۷">
        <picture>
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-6-wide.webp" type="image/webp">
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-6-wide.jpg">
          <source srcset="images/backgrounds/story-6.webp" type="image/webp">
          <img src="images/backgrounds/story-6.jpg" width="1080" height="1440" alt="مرحله ۳: صبر و اصالت در تولید — برای جا افتادن و کیفیت بی‌نظیر، بعضی کارها ممکنه چند روز زمان ببره ⏳" loading="lazy" decoding="async">
        </picture>
      </div>
      <div class="story-slide" role="group" aria-roledescription="اسلاید" aria-label="۷ از ۷">
        <picture>
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-7-wide.webp" type="image/webp">
          <source media="(min-width: 768px)" srcset="images/backgrounds/story-7-wide.jpg">
          <source srcset="images/backgrounds/story-7.webp" type="image/webp">
          <img src="images/backgrounds/story-7.jpg" width="1080" height="1440" alt="در آخر با عشق برات ارسالش می‌کنیم؛ از خانه‌ی ما، برای خانه‌ی تو — جعبه‌ی برگین به دست مشتری می‌رسه" loading="lazy" decoding="async">
        </picture>
      </div>
      <button type="button" class="story-btn story-btn-prev" aria-label="قبلی" hidden><span class="story-btn-text">قبلی</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="story-btn story-btn-next" aria-label="بعدیش رو ببین 👀"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg><span class="story-btn-text">بعدیش رو ببین 👀</span></button>
    </section>
    <script>
      (function () {
        var story = document.getElementById('story');
        if (!story) return;
        // Button texts live here only (one per slide) so bargin-content can review them later.
        var NEXT_TEXT = [
          'بعدیش رو ببین 👀',
          'هنوز تموم نشده…',
          'یه چیز دیگه هم داریم!',
          'بعدی رو از دست نده 😋',
          'این یکی رو ببین…',
          'یه دونه‌ی دیگه مونده!',
          'حالا بریم سراغ محصولات 🌿'
        ];
        var PREV_TEXT = 'قبلی';
        var slides = story.querySelectorAll('.story-slide');
        var bars = story.querySelectorAll('.story-bars span');
        var prevBtn = story.querySelector('.story-btn-prev');
        var nextBtn = story.querySelector('.story-btn-next');
        var nextText = nextBtn.querySelector('.story-btn-text');
        var count = slides.length, current = 0;
        var still = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        prevBtn.querySelector('.story-btn-text').textContent = PREV_TEXT;
        prevBtn.setAttribute('aria-label', PREV_TEXT);
        function show(i) {
          if (i < 0 || i >= count) return;
          current = i;
          for (var k = 0; k < count; k++) {
            slides[k].classList.toggle('is-active', k === current);
            bars[k].className = k <= current ? 'done' : '';
          }
          var label = NEXT_TEXT[current] || NEXT_TEXT[NEXT_TEXT.length - 1];
          nextText.textContent = label;
          nextBtn.setAttribute('aria-label', label);
          if (current === 0 && document.activeElement === prevBtn) nextBtn.focus();
          prevBtn.hidden = current === 0;
        }
        function goProducts() {
          var products = document.getElementById('products');
          if (!products) return;
          try { products.scrollIntoView({ behavior: still ? 'auto' : 'smooth', block: 'start' }); }
          catch (e) { products.scrollIntoView(true); }
          try { products.focus({ preventScroll: true }); } catch (e) { products.focus(); }
        }
        prevBtn.addEventListener('click', function () { show(current - 1); });
        nextBtn.addEventListener('click', function () {
          if (current < count - 1) show(current + 1); else goProducts();
        });
        story.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowRight' || e.key === 'Right') { e.preventDefault(); show(current + 1); }
          else if (e.key === 'ArrowLeft' || e.key === 'Left') { e.preventDefault(); show(current - 1); }
        });
        show(0);
      })();
    </script>
  </section>

  <main class="container">

    <form class="search" role="search" action="#">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
      <input type="search" id="search" placeholder="دنبال چی می‌گردی؟" aria-label="جستجوی محصولات" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button type="button" class="search-clear" aria-label="پاک کردن" hidden>×</button>
    </form>

    <section class="steps" aria-label="راهنمای سفارش">

      <ol>
        <li><span class="step-num">۱</span><strong>محصولتو انتخاب کن</strong></li>
        <li><span class="step-num">۲</span><strong>تو واتساپ یا اینستاگرام بهمون پیام بده</strong></li>
        <li><span class="step-num">۳</span><strong>سفارشت ثبت می‌شه!</strong></li>
      </ol>
    </section>
  </main>
