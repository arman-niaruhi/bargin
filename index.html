<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>برگین</title>
  <link rel="icon" href="images/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="hero">
    <img class="hero-logo" src="images/logo.jpg" alt="برگین — از طبیعت تا خانه شما">
    <p class="hero-lead">محصولات خانگی برگین</p>
    <p class="hero-intro">ما انواع سبزی‌ها، رب‌ها، مرباها، ترشیجات و کلی چیز دیگه رو توی خونه‌ی خودمون تولید می‌کنیم؛ از خونه‌ی ما، برای خونه‌ی تو 🌿</p>
  </section>

  <main class="container">
    <h2 class="section-title"><span>محصولات</span></h2>
    <form class="search" role="search" action="#">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
      <input type="search" id="search" placeholder="دنبال چی می‌گردی؟" aria-label="جستجوی محصولات" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button type="button" class="search-clear" aria-label="پاک کردن" hidden>×</button>
    </form>
    <nav class="filters" id="filters" aria-label="دسته‌بندی محصولات"></nav>
    <div class="grid" id="product-grid"></div>

    <section class="steps" aria-label="راهنمای سفارش">
      <h2 class="section-title"><span>چطوری سفارش بدم؟</span></h2>
      <ol>
        <li><span class="step-num">۱</span><strong>محصولتو انتخاب کن</strong></li>
        <li><span class="step-num">۲</span><strong>تو واتساپ یا اینستاگرام بهمون پیام بده</strong></li>
        <li><span class="step-num">۳</span><strong>سفارشت ثبت می‌شه!</strong></li>
      </ol>
    </section>
  </main>

  <footer class="site-footer" id="footer"></footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
  <script>loadData().then(renderHome);</script>
</body>
</html>
